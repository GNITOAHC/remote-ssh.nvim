name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build binaries — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_server: rnvim-server-linux-x86_64
            asset_client: rnvim-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset_server: rnvim-server-linux-aarch64
            asset_client: rnvim-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_server: rnvim-server-darwin-x86_64
            asset_client: rnvim-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_server: rnvim-server-darwin-aarch64
            asset_client: rnvim-darwin-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          pip install ziglang cargo-zigbuild

      - name: Build binaries
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cargo zigbuild --release --package rnvim-server --target ${{ matrix.target }}
            cargo zigbuild --release --package rnvim --target ${{ matrix.target }}
          else
            cargo build --release --package rnvim-server --target ${{ matrix.target }}
            cargo build --release --package rnvim --target ${{ matrix.target }}
          fi

      - name: Prepare assets
        run: |
          cp target/${{ matrix.target }}/release/rnvim-server ${{ matrix.asset_server }}
          cp target/${{ matrix.target }}/release/rnvim ${{ matrix.asset_client }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            ${{ matrix.asset_server }}
            ${{ matrix.asset_client }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
